{% extends "base.html" %}

{% block title %}Пользователи{% endblock %}

{% block content %}
<h1>Пользователи</h1>
<p>Всего пользователей: {{ users|length }}</p>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>
                <a href="{% url 'users:detail' user.id %}">
                    №{{ user.id }}
                </a>
            </td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Пользователи не найдены.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
